<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b4befe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cba6f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5c2e7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cba6f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f5c2e7;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Glow effect background -->
  <circle cx="24" cy="24" r="20" fill="url(#glowGradient)" opacity="0.4" />
  
  <!-- Lock body -->
  <rect 
    x="14" 
    y="22" 
    width="20" 
    height="16" 
    rx="2"
    fill="url(#lockGradient)"
  />
  
  <!-- Lock shackle -->
  <path 
    d="M18 22V16C18 12.6863 20.6863 10 24 10C27.3137 10 30 12.6863 30 16V22" 
    stroke="url(#lockGradient)" 
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
  
  <!-- Keyhole -->
  <circle 
    cx="24" 
    cy="28" 
    r="2.5" 
    fill="#1e1e2e"
  />
  <rect 
    x="22.5" 
    y="28" 
    width="3" 
    height="5" 
    rx="1"
    fill="#1e1e2e"
  />
  
  <!-- Highlight shine effect -->
  <path 
    d="M20 24C20 24 22 25 24 25C26 25 28 24 28 24" 
    stroke="#ffffff" 
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.3"
  />
</svg>
